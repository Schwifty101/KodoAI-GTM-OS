[project]
name = "gtm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.5.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "supabase>=2.34.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["db: touches the real Supabase project (uses a TEST batch, cleans up)"]
